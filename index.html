<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier Cartographe — cartes de level design</title>
<style>
:root{--bg:#1a1d22;--panel:#22262d;--panel2:#2a2f37;--panel3:#343a44;--line:#3a414c;--text:#e6e8eb;--muted:#97a1ad;--accent:#4f9cf0;--accent2:#2f6fb8;--danger:#e05252;--ok:#4fbf7f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:46px 1fr 310px;grid-template-rows:44px 1fr 26px;height:100vh}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--panel3)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent2);border-color:var(--accent)}
button.primary:hover{background:var(--accent)}
button.danger:hover{background:var(--danger);border-color:var(--danger)}
button.ib{width:30px;padding:4px 0;text-align:center;font-size:15px}
input[type=text],input[type=number],input[type=email],input[type=password],input:not([type]),select,textarea{background:#181b20;border:1px solid var(--line);border-radius:5px;padding:4px 6px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;width:100%}
input[type=color]{width:30px;height:26px;padding:1px;border:1px solid var(--line);border-radius:5px;background:#181b20;cursor:pointer;flex:none}
input[type=range]{accent-color:var(--accent);min-width:0}
input[type=checkbox]{accent-color:var(--accent)}
#top{grid-column:1/4;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:700;color:#cfe3ff;margin-right:4px;white-space:nowrap}
#docName{width:200px;background:transparent;border-color:transparent;font-weight:600}
#docName:hover,#docName:focus{border-color:var(--line);background:#181b20}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:none;border-radius:0;background:var(--panel2);padding:4px 9px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent2);color:#fff}
.seg.sm button{padding:2px 7px;font-size:12px}
.savest{font-size:12px;color:var(--muted);margin-right:6px}
#tools{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;overflow-y:auto}
#tools .tb{width:36px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;background:transparent;border-color:transparent;position:relative}
#tools .tb:hover{background:var(--panel3)}
#tools .tb.on{background:var(--accent2);border-color:var(--accent)}
#tools .tb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#tools .tb .k{position:absolute;right:2px;bottom:0;font-size:9px;color:var(--muted)}
#tools .tsep{width:26px;height:1px;background:var(--line);margin:4px 0}
#canvasWrap{position:relative;overflow:hidden;background:#111}
#stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;user-select:none;cursor:default}
#stage[data-tool=hand],#stage.space{cursor:grab}
#stage.panning{cursor:grabbing!important}
#stage[data-tool=rect],#stage[data-tool=ellipse],#stage[data-tool=polygon],#stage[data-tool=polyline],#stage[data-tool=wall],#stage[data-tool=door],#stage[data-tool=pen],#stage[data-tool=free],#stage[data-tool=proc],#stage[data-tool=measure],#stage[data-tool=flow],#stage[data-tool=icon],#stage[data-tool=note]{cursor:crosshair}
#stage[data-tool=text]{cursor:text}
#stage[data-tool=select] [data-oid]{cursor:move}
#stage[data-tool=flow] .bub,#stage[data-tool=icon] .ico,#stage[data-tool=note] .note{cursor:pointer}
#stage[data-tool=flow] .lnk{cursor:copy}
body.m-read #stage{cursor:grab}
body.m-read #stage .bub,body.m-read #stage .ico{cursor:help}
.lyr.noint{pointer-events:none}
.lyr.locked [data-oid]{cursor:default!important}
.hdl{fill:#fff;stroke:#2f8cff;stroke-width:1.5}
.h-nw,.h-se{cursor:nwse-resize}.h-ne,.h-sw{cursor:nesw-resize}.h-n,.h-s{cursor:ns-resize}.h-e,.h-w{cursor:ew-resize}
.hdlv{fill:#fff;stroke:#2f8cff;stroke-width:2;cursor:move}
.hdlv.op{stroke:#e8742a;fill:#ffe2c8}
.hdlr{fill:#fff;stroke:#2f8cff;stroke-width:1.5;cursor:grab}
.hdlb{fill:#2f8cff;stroke:#fff;stroke-width:1.5;cursor:move}
.ovtxt{font:600 11px system-ui,sans-serif;fill:#1d4ed8;paint-order:stroke;stroke:#fff;stroke-width:3px}
.ovtxt.big{font-size:13px;fill:#c2185b}
#toolOpts{position:absolute;left:10px;top:10px;right:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;pointer-events:none}
#toolOpts .box{pointer-events:auto;display:flex;align-items:center;gap:6px;background:rgba(34,38,45,.94);border:1px solid var(--line);border-radius:8px;padding:4px 8px;box-shadow:0 2px 10px #0005}
#toolOpts .hint{pointer-events:none;color:#c9d1db;font-size:12px;background:rgba(34,38,45,.85);border-radius:6px;padding:4px 8px;max-width:640px}
#toolOpts label{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
#side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#layersSec{flex:0 0 auto;max-height:44%;display:flex;flex-direction:column;border-bottom:1px solid var(--line);min-height:0}
.sechead{display:flex;align-items:center;justify-content:space-between;padding:7px 10px 3px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.floorbar{display:flex;gap:4px;padding:2px 10px 4px;align-items:center}
.floorbar select{flex:1}
.floorbar .fdot{width:10px;height:10px;border-radius:3px;flex:none}
.floorbar2{display:flex;gap:6px;padding:0 10px 6px;align-items:center;font-size:12px;color:var(--muted)}
#layerList{overflow-y:auto;flex:1;min-height:40px;padding:0 6px}
.lrow{display:flex;align-items:center;gap:4px;padding:3px 4px;border-radius:6px;border:1px solid transparent;margin-bottom:1px;cursor:pointer}
.lrow:hover{background:var(--panel2)}
.lrow.on{background:#2b3a50;border-color:#3d5f8c}
.lrow.dragover-top{box-shadow:inset 0 2px 0 var(--accent)}
.lrow.dragover-bot{box-shadow:inset 0 -2px 0 var(--accent)}
.lrow .lt{width:18px;text-align:center;color:var(--muted);flex:none}
.lrow .ln{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .ln input{width:100%}
.lrow .lc{font-size:10px;color:var(--muted)}
.lrow .lo{width:52px}
.lrow button{background:transparent;border:none;padding:2px 3px;color:var(--muted);display:flex}
.lrow button:hover{color:var(--text);background:var(--panel3)}
.lrow button.off{color:#5f6874}
.lrow.hid .ln{opacity:.45}
.lrow .badge{font-size:10px;background:var(--panel3);border-radius:4px;padding:0 4px;color:var(--muted)}
.lrow .fsw{width:6px;height:16px;border-radius:2px;flex:none}
.lbtns{display:flex;gap:4px;padding:6px 10px 8px}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 6px}
.tabs button{flex:1;background:transparent;border:none;border-bottom:2px solid transparent;border-radius:0;padding:8px 4px;color:var(--muted)}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
#tabBody{flex:1;overflow-y:auto;padding:8px 10px 20px;min-height:0}
.ph{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.ph .pk{font-weight:700}
.ph .pl{font-size:11px;color:var(--muted);background:var(--panel2);border-radius:4px;padding:1px 6px}
.acts{display:flex;gap:4px;margin:0 0 10px}
.acts button{flex:1;padding:4px 0}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
.row>label{width:84px;flex:none;color:var(--muted);font-size:12px}
.row .ctl{flex:1;display:flex;align-items:center;gap:5px;min-width:0}
.row .ctl>input[type=text],.row .ctl>input[type=email],.row .ctl>input[type=password],.row .ctl>select,.row .ctl>input:not([type]){flex:1}
.row .ctl>input[type=number]{width:70px}
.row .ctl>input[type=range]{flex:1}
.row.col{flex-direction:column;align-items:stretch}
.row.col>label{width:auto}
.u{color:var(--muted);font-size:12px}
.sub{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 4px;border-top:1px solid var(--line);padding-top:10px}
.muted{color:var(--muted);font-size:12px}
.tipbox{background:var(--panel2);border-radius:8px;padding:8px 10px;color:var(--muted);font-size:12px;margin:8px 0}
.tipbox b{color:var(--text)}
.kv{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:3px 0}
.kv b{color:var(--text);font-weight:600}
.btnrow{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.swatches{display:flex;gap:4px}
.swatches button{width:22px;height:22px;padding:0;border-radius:5px}
.imgprev{max-width:100%;max-height:140px;border-radius:6px;display:block;margin:4px 0;background:#fff}
/* Icônes */
.isearch{display:flex;gap:6px;margin-bottom:6px}
.isearch input{flex:1}
.icat{margin-bottom:6px}
.ich{display:flex;align-items:center;gap:6px;padding:5px 4px;font-weight:600;cursor:pointer;border-radius:5px}
.ich:hover{background:var(--panel2)}
.ich .dot{width:10px;height:10px;border-radius:50%}
.ich .ic,.irow .ic{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400;min-width:18px;text-align:right}
.ich button,.irow button{background:transparent;border:none;padding:1px 3px;color:var(--muted);display:flex}
.ich button:hover,.irow button:hover{color:var(--text)}
.irow{display:flex;align-items:center;gap:8px;padding:3px 6px 3px 14px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.irow:hover{background:var(--panel2)}
.irow.on{background:#2b3a50;border-color:#3d5f8c}
.irow.hid{opacity:.45}
.irow .pic,.pic{flex:none;display:block}
/* Flow */
.frow{display:flex;align-items:center;gap:5px;padding:3px;border-radius:6px;border:1px solid transparent}
.frow.on{background:#2b3a50;border-color:#3d5f8c}
.frow .fn{min-width:24px;height:24px;border-radius:12px;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none;padding:0 5px}
.frow input{flex:1}
.frow button{padding:2px 5px;background:transparent;border:none;color:var(--muted)}
.frow button:hover{color:var(--text);background:var(--panel3)}
.fsub{font-size:11px;color:var(--muted);padding:0 4px 4px 36px}
.fdesc{margin:0 4px 8px 36px;width:calc(100% - 40px)}
/* Popover, modales */
#popover{position:fixed;display:none;z-index:80;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 30px #0008;padding:8px;min-width:200px;max-width:340px;max-height:80vh;overflow:auto}
#popover .mi{display:block;width:100%;text-align:left;background:transparent;border:none;padding:6px 10px}
#popover .mi:hover{background:var(--panel3)}
#popover .mi .k{float:right;color:var(--muted);font-size:11px;margin-left:16px}
#popover hr{border:none;border-top:1px solid var(--line);margin:4px 0}
#modalBg{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:60}
#modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:440px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px #000a}
#modal.wide{width:780px}
#modal .mh{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
#modal .mh .x{background:transparent;border:none;font-size:16px}
#modal .mb{padding:12px 14px;overflow:auto}
#modal .mf{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
#modal .mf .grow{flex:1}
.lib{display:grid;grid-template-columns:230px 1fr;gap:12px;min-height:360px}
.libL{border-right:1px solid var(--line);padding-right:10px}
.lcat{display:flex;gap:4px;align-items:center;padding:4px;border-radius:6px;margin-bottom:3px;border:1px solid transparent;cursor:pointer}
.lcat.on{background:#2b3a50;border-color:#3d5f8c}
.lcat input:not([type]){flex:1;width:100%}
.lcat button,.ltype button{padding:2px 6px}
.ltype{display:flex;gap:6px;align-items:center;margin-bottom:5px}
.ltype input:not([type]){flex:1}
.ltype .picbtn{padding:2px;background:#fff1;display:flex}
.ltype label{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:3px}
.pgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.pgrid button{padding:3px;display:flex;align-items:center;justify-content:center;font-size:18px}
.ptabs{display:flex;gap:4px;margin-bottom:8px}
.ptabs button.on{background:var(--accent2)}
.legrow{display:flex;gap:6px;align-items:center;margin:3px 0}
.legrow input:not([type]){flex:1}
.legrow .ls{width:28px;display:flex;justify-content:center}
.help h3{margin:14px 0 6px;font-size:13px;color:#cfe3ff}
.help table{border-collapse:collapse;width:100%}
.help td{padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.help td:first-child{white-space:nowrap;color:var(--accent);width:150px}
.help p{color:var(--muted);margin:4px 0}
kbd{background:var(--panel3);border-radius:4px;padding:0 5px;font-size:11px;border:1px solid var(--line)}
/* Info-bulle */
#tip{position:absolute;display:none;z-index:20;background:#fff;color:#1f2328;border-radius:8px;box-shadow:0 6px 24px #0006;padding:8px 10px;max-width:280px;font-size:12.5px;pointer-events:none}
#tip.pinned{pointer-events:auto;padding-right:26px}
#tip .th{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
#tip .tn{min-width:20px;height:20px;border-radius:10px;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;padding:0 4px}
#tip .tt{color:#667;font-size:11px;margin-top:1px}
#tip .td{white-space:pre-wrap;margin-top:6px;line-height:1.4}
#tip img{max-width:100%;max-height:160px;border-radius:6px;margin-top:6px;display:block}
#tip .tx{position:absolute;right:4px;top:4px;background:transparent;border:none;color:#667;padding:2px 6px}
/* Statut, toasts */
#status{grid-column:1/4;display:flex;align-items:center;gap:14px;padding:0 10px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
#status .zb{padding:0 7px;height:20px;font-size:12px;background:transparent}
#toasts{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:70;pointer-events:none}
.toast{background:#2b3a50;border:1px solid #3d5f8c;color:#fff;padding:7px 14px;border-radius:8px;box-shadow:0 4px 16px #0007;font-size:12.5px;animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
body.m-read .edit-only,body.m-comment .edit-only{display:none!important}
body.m-read #tools .tb:not([data-t=hand]):not([data-t=measure]){display:none}
body.m-comment #tools .tb:not([data-t=hand]):not([data-t=measure]):not([data-t=select]):not([data-t=note]){display:none}
body.m-read #tools .tsep,body.m-comment #tools .tsep{display:none}
#peers{display:flex;gap:3px;margin-right:4px}
.peer{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px;border:2px solid var(--panel);box-shadow:0 0 0 1px #0005}
.peer.more{background:var(--panel3);color:var(--muted)}
.mlist{display:flex;flex-direction:column;gap:4px}
.mrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;background:var(--panel2);border:1px solid transparent}
.mrow.on{border-color:#3d5f8c;background:#2b3a50}
.mrow .mn{flex:1;display:flex;flex-direction:column;min-width:0}
code{}
.opblock{border-left:2px solid var(--line);padding-left:8px;margin:6px 0 10px}
code{background:var(--panel3);border-radius:4px;padding:0 4px;font-size:12px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#3a414c;border-radius:5px}::-webkit-scrollbar-track{background:transparent}

</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand" title="Atelier Cartographe">◈ <span>Atelier Cartographe</span></div>
    <input id="docName" spellcheck="false" title="Nom de la carte">
    <div class="menu">
      <button id="bFile" data-pop>Fichier ▾</button>
    </div>
    <button id="bUndo" class="ib edit-only" title="Annuler (Ctrl+Z)">↶</button>
    <button id="bRedo" class="ib edit-only" title="Rétablir (Ctrl+Maj+Z)">↷</button>
    <span class="sep"></span>
    <div class="seg" id="viewSeg" title="Projection"><button data-v="top">Dessus</button><button data-v="iso">Isométrique</button></div><button class="ib isorot" data-r="-90" title="Tourner la vue iso">⟲</button><button class="ib isorot" data-r="90" title="Tourner la vue iso">⟳</button>
    <button id="bGrid" data-pop class="edit-only">Grille ▾</button>
    <button id="bHeight" data-pop>Hauteurs ▾</button>
    <button id="bLegend">Légende</button>
    <span class="grow"></span>
    <span id="peers"></span>
    <span id="saveState" class="savest"></span><span id="cloudState" class="savest" style="display:none"></span>
    <button id="bCloud" data-pop title="Collaboration en ligne">☁ En ligne ▾</button>
    <div class="seg" id="modeSeg" title="Mode d’accès"><button data-m="edit">Édition</button><button data-m="comment">Commentaire</button><button data-m="read">Lecture</button></div>
    <button id="bHelp" class="ib" title="Aide">?</button>
  </header>
  <nav id="tools"></nav>
  <main id="canvasWrap">
    <svg id="stage" xmlns="http://www.w3.org/2000/svg">
      <defs id="staticDefs"></defs><defs id="dynDefs"></defs>
      <rect id="bgRect" x="0" y="0" width="100%" height="100%"/>
      <g id="gridG"></g>
      <g id="layersG"></g>
      <g id="overlayG"></g>
      <g id="legendG"></g>
    </svg>
    <div id="toolOpts"></div>
    <div id="tip"></div>
  </main>
  <aside id="side">
    <section id="layersSec"></section>
    <div class="tabs" id="sideTabs">
      <button data-tab="props">Propriétés</button>
      <button data-tab="icons">Icônes</button>
      <button data-tab="flow">Flow</button>
    </div>
    <section id="tabBody"></section>
  </aside>
  <footer id="status">
    <span id="stCoords"></span>
    <span id="stInfo"></span>
    <span class="grow"></span>
    <button class="zb" id="zOut" title="Zoom arrière (-)">−</button>
    <button class="zb" id="zLabel" title="Zoom 100 % (1)">100 %</button>
    <button class="zb" id="zIn" title="Zoom avant (+)">+</button>
    <button class="zb" id="zFit" title="Tout afficher (0)">⤢</button>
  </footer>
</div>
<div id="popover"></div>
<div id="modalBg"><div id="modal"></div></div>
<div id="toasts"></div>
<input type="file" id="fileImg" accept="image/*,.svg" multiple hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<input type="file" id="fileLib" accept=".json,application/json" hidden>
<input type="file" id="fileAny" accept="image/*,.svg" hidden>
<input type="file" id="fileSvg" accept=".svg,image/svg+xml" hidden>
<script>
'use strict';
/* =====================================================================
   CONFIGURATION DU SERVEUR EN LIGNE (Supabase)

   Supabase > Project Settings > API (ou « Connect »)
     url : Project URL            ex. https://abcdefgh.supabase.co
     key : clé publique « anon » ou « publishable » (jamais la clé service_role !)
   Laissées vides, elles peuvent aussi être saisies dans l'outil
   (menu « En ligne › Configurer le serveur »).
   ===================================================================== */
const CLOUD_CONFIG = {
  url: 'https://xgmynzpncxsuvgbwcdxl.supabase.co',
  key: 'sb_publishable_-ZmMaHzvly479hHT412TGg_LTeMdNns',
};

/* ===== Pictogrammes intégrés (viewBox 24x24, blanc sur pastille) ===== */

const H = { undo: [], redo: [], B: null };
function metaStr(doc = S.doc) {

}
function baseline() { const objs = new Map(); for (const [id, o] of Object.entries(S.doc.objects)) objs.set(id, JSON.stringify(o)); return { objs, meta: metaStr() }; }
function histReset() { H.undo = []; H.redo = []; H.B = baseline(); updateUndoButtons(); }
function diffNow() {

  for (const [id, b] of B.objs) if (!seen.has(id)) o.push([id, b, null]);

/* Remet d'aplomb la liste des objets de chaque calque et l'ordre des bulles

function reconcile() {

/* ===== Génération procédurale ===== */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const procCache = new Map();
function genProc(o) {
  const pts = geomPts(o), key = JSON.stringify([pts, o.gen]);
  if (procCache.has(key)) return procCache.get(key);
  const out = genProcRaw(pts, o.gen);
  if (procCache.size > 300) procCache.clear();

}
function genProcRaw(pts, g) {
  if (!pts || pts.length < 3) return '';

  const R = () => rng();
  const [x0, y0, x1, y1] = bboxOf(pts);
  const base = (GENS[g.type]?.base || 20) * (g.scale || 1) * (S.doc.grid.size / 32);
  let sp = base / Math.sqrt(g.density || 1);
  const area = Math.max(1, (x1 - x0) * (y1 - y0));
  while (area / (sp * sp) > 3500) sp *= 1.15;
  const c = g.c, bg = g.bg;
  let s = `<polygon points="${ptsStr(pts)}" fill="${bg}"/>`;
  const near = (x, y, m) => pip(x, y, pts) || nearestSeg(pts, [x, y], true).d < m;

  if (g.type !== 'dallage') {
    for (let y = y0 - sp; y <= y1 + sp; y += sp) for (let x = x0 - sp; x <= x1 + sp; x += sp) {
      const px = x + (R() - 0.5) * sp * 0.95, py = y + (R() - 0.5) * sp * 0.95;
      const a = R(), b = R(), e = R();
      if (near(px, py, sp * 0.5)) samples.push([px, py, a, b, e]);
    }
  }
  const F = f1;
  switch (g.type) {
    case 'foret': {
      samples.sort((p, q) => p[1] - q[1]);
      const sh = shade(c, -0.5);
      for (const [x, y, a, b] of samples) {
        const r = sp * (0.5 + 0.35 * a);
        s += `<circle cx="${F(x + r * 0.22)}" cy="${F(y + r * 0.3)}" r="${F(r)}" fill="${sh}" fill-opacity=".45"/>`;
        s += `<circle cx="${F(x)}" cy="${F(y)}" r="${F(r)}" fill="${shade(c, (b - 0.5) * 0.35)}"/>`;
        s += `<circle cx="${F(x - r * 0.3)}" cy="${F(y - r * 0.32)}" r="${F(r * 0.42)}" fill="${shade(c, 0.28)}" fill-opacity=".6"/>`;
      }
      break;
    }
    case 'herbe': {
      const k = sp / 14;
      let d = '';
      for (const [x, y, a] of samples) {
        const h = (4 + a * 4) * k;
        d += `M${F(x)},${F(y)}l${F(-2 * k)},${F(-h * 0.8)}M${F(x)},${F(y)}l0,${F(-h)}M${F(x)},${F(y)}l${F(2 * k)},${F(-h * 0.8)}`;
      }
      s += `<path d="${d}" stroke="${c}" stroke-width="${F(sp * 0.09)}" stroke-linecap="round" fill="none"/>`;
      break;
    }
    case 'rochers': {
      for (const [x, y, a, b, e] of samples) {

        s += `<polygon points="${ptsStr(vs)}" fill="${shade(c, (b - 0.5) * 0.35)}" stroke="${shade(c, -0.45)}" stroke-width="${F(r * 0.12)}" stroke-linejoin="round"/>`;
      }
      break;
    }
    case 'eau': {
      let d = '';

      break;
    }
    case 'lave': {

        else if (e > 0.85) { const r = sp * (0.15 + 0.2 * a); s += `<polygon points="${ptsStr([[x - r, y], [x, y - r * 0.7], [x + r, y + r * 0.1], [x + r * 0.2, y + r * 0.6]])}" fill="${shade(bg, -0.55)}"/>`; }
      }
      break;
    }
    case 'dallage': {
      const bh = sp * 0.75, bw = sp * 1.5;

      for (let y = y0 - bh; y <= y1 + bh; y += bh, row++) {

        }
      }
      break;
    }
    case 'gravats': {
      for (const [x, y, a, b] of samples) {

      }
      break;
    }
    case 'sable': {
      for (const [x, y, a, b] of samples) s += `<circle cx="${F(x)}" cy="${F(y)}" r="${F(sp * (0.08 + 0.1 * a))}" fill="${shade(c, (b - 0.5) * 0.4)}" fill-opacity=".75"/>`;
      break;
    }
  }
  return s;
}

/* Enregistre une carte en ligne (la carte actuelle par défaut) puis l'ouvre */
async function publishMap(doc) {
  if (!doc || !doc.objects) doc = S.doc;
  if (!await ensureLogged(() => publishMap(doc))) return;
  const prog = progressModal('Enregistrement en ligne');
  try {
    const meta = JSON.parse(metaStr(doc));
    const { data: m, error } = await C.sb.from('carto_maps').insert({ name: doc.name || 'Carte', doc: meta, updated_by: C.sid }).select('id').single();
    if (error) throw error;
    const id = m.id;
    const assets = [...usedAssets(doc)].filter(k => doc.assets[k]);
    let n = 0;
    for (const ch of chunk(assets, 3)) {
      const { error: e } = await C.sb.from('carto_assets').upsert(ch.map(k => ({ map_id: id, id: k, data: doc.assets[k] })), { onConflict: 'map_id,id', ignoreDuplicates: true });
      if (e) throw e; n += ch.length; prog(`Images : ${n} / ${assets.length}`);
    }
    const objs = Object.values(doc.objects); n = 0;
    for (const ch of chunk(objs, 300)) {
      const { error: e } = await C.sb.from('carto_objects').upsert(ch.map(o => ({ map_id: id, id: o.id, kind: o.kind, data: o, updated_by: C.sid })), { onConflict: 'map_id,id' });
      if (e) throw e; n += ch.length; prog(`Objets : ${n} / ${objs.length}`);
    }
    closeModal();
    await openCloudMap(id);
    toast('Carte enregistrée en ligne : elle se synchronise désormais toute seule. « Partager » pour inviter des personnes.', 4500);
  } catch (e) { closeModal(); toast('Enregistrement en ligne impossible : ' + cloudErr(e), 5000); }
}

async function openCloudMap(id) {
  if (!await ensureLogged(() => openCloudMap(id))) return;
  if (C.loading) return;
  C.loading = true; setCloudStatus('sync');
  try {
    if (C.mapId && C.mapId !== id) await cloudLeave(true);
    const { data: role, error: e1 } = await C.sb.rpc('carto_join', { m: id });
    if (e1) throw e1;
    if (!role) { toast('Tu n’as pas accès à cette carte. Demande au propriétaire de la partager avec ' + cloudEmail(), 5000); setCloudStatus(C.mapId ? 'ok' : 'off'); return; }
    const { data: m, error: e2 } = await C.sb.from('carto_maps').select('id,name,doc,owner,link_role').eq('id', id).single();
    if (e2) throw e2;
    const objects = {};
    for (let from = 0; ; from += 1000) {
      const { data, error } = await C.sb.from('carto_objects').select('id,data').eq('map_id', id).range(from, from + 999);
      if (error) throw error; for (const r of data) objects[r.id] = r.data; if (data.length < 1000) break;
    }
    const assets = {};
    for (let from = 0; ; from += 10) {
      const { data, error } = await C.sb.from('carto_assets').select('id,data').eq('map_id', id).range(from, from + 9);
      if (error) throw error; for (const r of data) assets[r.id] = r.data; if (data.length < 10) break;
    }
    C.mapId = id; C.role = role; C.owner = m.owner; C.linkRole = m.link_role;
    C.uploaded = new Set(Object.keys(assets)); C.pending = { objs: new Map(), meta: null }; C.peers.clear();
    const local = S.doc?.settings ? { view: S.doc.settings.view } : {};
    const d = migrate({ ...(m.doc || {}), name: m.name, objects, assets });
    Object.assign(d.settings, local);
    loadDoc(d);
    S.mode = role === 'read' ? 'read' : role === 'comment' ? 'comment' : 'edit';
    applyMode();
    subscribeMap(id);
    try { history.replaceState(null, '', location.pathname + '?carte=' + id); } catch (e) { }
    setCloudStatus('ok');
    toast(`Carte en ligne « ${m.name} » · ${ROLE_LABEL[role]}`);
  } catch (e) { toast('Ouverture impossible : ' + cloudErr(e), 5000); setCloudStatus(C.mapId ? 'err' : 'off', cloudErr(e)); }
  finally { C.loading = false; updateCloudUI(); }
}
async function cloudLeave(silent) {
  if (C.mapId && (C.pending.objs.size || C.pending.meta)) { clearTimeout(C.flushT); await cloudFlush(); }
  if (C.channel) { try { await C.sb.removeChannel(C.channel); } catch (e) { } C.channel = null; }
  C.mapId = null; C.role = null; C.peers.clear(); C.status = 'off';
  try { history.replaceState(null, '', location.pathname); } catch (e) { }
  if (!silent) {
    let d = null;
    if (IDB.db) { const a = await IDB.get('autosave'); if (a) try { d = migrate(JSON.parse(a)); } catch (e) { } }
    S.mode = 'edit';
    loadDoc(d || newDoc());
    toast('Retour à ta carte locale');
  }
  updateCloudUI();
}

/* --- Temps réel --- */
function subscribeMap(id) {
  const ch = C.sb.channel('carto:' + id, { config: { presence: { key: C.sid }, broadcast: { self: false } } });
  ch.on('postgres_changes', { event: '*', schema: 'public', table: 'carto_objects', filter: `map_id=eq.${id}` }, onRemoteObj)
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'carto_objects' }, onRemoteObj)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'carto_maps', filter: `id=eq.${id}` }, onRemoteMap)
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'carto_maps' }, p => { if (p.old?.id === C.mapId) { toast('Cette carte a été supprimée par son propriétaire', 5000); cloudLeave(false); } })
    .on('presence', { event: 'sync' }, () => updatePeers(ch.presenceState()))
    .on('broadcast', { event: 'cur' }, ({ payload }) => onPeerCursor(payload))
    .subscribe(async status => {
      if (status === 'SUBSCRIBED') { try { await ch.track({ name: S.user || cloudEmail(), color: peerColor(C.sid) }); } catch (e) { } if (C.status !== 'sync') setCloudStatus('ok'); }
      else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') setCloudStatus('err', 'Connexion temps réel interrompue');
    });
  C.channel = ch;
}
let remoteT = null;
function onRemoteObj(p) {
  if (!C.mapId) return;
  if (p.eventType === 'DELETE') {
    const o = p.old || {}; if (o.map_id !== C.mapId || !o.id || !S.doc.objects[o.id]) return;
    if (C.pending.objs.has(o.id) && C.pending.objs.get(o.id) !== null) return; // modification locale en attente : elle l'emporte
    delete S.doc.objects[o.id]; H.B.objs.delete(o.id); S.sel.delete(o.id);
  } else {
    const r = p.new; if (!r || r.map_id !== C.mapId || r.updated_by === C.sid) return;
    if (C.pending.objs.has(r.id)) return;
    S.doc.objects[r.id] = r.data; H.B.objs.set(r.id, JSON.stringify(r.data));
    fetchMissingAssets([r.data.asset, r.data.img]);
  }
  scheduleRemoteRefresh();
}
function onRemoteMap(p) {
  const r = p.new; if (!r || r.id !== C.mapId) return;
  C.linkRole = r.link_role;
  if (r.updated_by === C.sid || C.pending.meta) return;
  if (!r.doc || !r.doc.layers) return;
  setMeta({ ...r.doc, name: r.name });
  fetchMissingAssets(S.doc.library.types.filter(t => t.picto?.kind === 'asset').map(t => t.picto.value));
  scheduleRemoteRefresh();
}
function scheduleRemoteRefresh() {
  clearTimeout(remoteT);
  remoteT = setTimeout(() => {
    reconcile(); H.B.meta = metaStr(); validateState(); markAllDirty(); scheduleRender();
    const typing = document.activeElement && document.activeElement.closest?.('#tabBody, #layersSec, #modal');
    refreshPanels({ keepPanel: !!typing, keepLayers: !!typing });
  }, 40);
}
async function fetchMissingAssets(ids) {
  const need = ids.filter(k => k && !S.doc.assets[k]); if (!need.length || !C.mapId) return;
  const { data, error } = await C.sb.from('carto_assets').select('id,data').eq('map_id', C.mapId).in('id', need);
  if (error || !data) return;
  for (const r of data) { S.doc.assets[r.id] = r.data; C.uploaded.add(r.id); }
  markAllDirty(); scheduleRender(); if (S.sideTab === 'icons') renderTabBody();
}
function cloudPush(p) {
  if (!C.mapId || C.role === 'read') return;
  for (const [id, , a] of p.o) C.pending.objs.set(id, a);
  if (p.m && ROLE_RANK[C.role] >= 3) C.pending.meta = p.m[1];
  if (!C.pending.objs.size && !C.pending.meta) return;
  setCloudStatus('sync'); clearTimeout(C.flushT); C.flushT = setTimeout(cloudFlush, 250);
}
async function cloudFlush() {
  if (!C.mapId || !C.sb) return;
  if (C.flushing) { clearTimeout(C.flushT); C.flushT = setTimeout(cloudFlush, 200); return; }
  const objs = C.pending.objs, meta = C.pending.meta, mapId = C.mapId;
  C.pending = { objs: new Map(), meta: null };
  if (!objs.size && !meta) { setCloudStatus('ok'); return; }
  C.flushing = true;
  const editor = ROLE_RANK[C.role] >= 3;
  try {
    const ups = [], dels = [];
    for (const [id, a] of objs) {
      if (a === null) { dels.push(id); continue; }
      const d = JSON.parse(a); if (!editor && d.kind !== 'note') continue;
      ups.push({ map_id: mapId, id, kind: d.kind, data: d, updated_by: C.sid });
    }
    if (editor) {
      const need = new Set();
      for (const u of ups) { if (u.data.asset) need.add(u.data.asset); if (u.data.img) need.add(u.data.img); }
      if (meta) for (const t of S.doc.library.types) if (t.picto?.kind === 'asset') need.add(t.picto.value);
      const arows = [...need].filter(k => !C.uploaded.has(k) && S.doc.assets[k]).map(k => ({ map_id: mapId, id: k, data: S.doc.assets[k] }));
      for (const ch of chunk(arows, 3)) {
        const { error } = await C.sb.from('carto_assets').upsert(ch, { onConflict: 'map_id,id', ignoreDuplicates: true });
        if (error) throw error; ch.forEach(r => C.uploaded.add(r.id));
      }

    }
    for (const ch of chunk(ups, 300)) { const { error } = await C.sb.from('carto_objects').upsert(ch, { onConflict: 'map_id,id' }); if (error) throw error; }

        };

}

  const dfs = b => { const st = [b]; while (st.length) { const x = st.pop(); if (seen.has(x)) continue; seen.add(x); out.push(x); const nx = (adj.get(x) || []).map(e => e.to).filter(t => !seen.has(t)); for (let i = nx.length - 1; i >= 0; i--) st.push(nx[i]); } };
  dfs(bs[0]); for (const b of bs) if (!seen.has(b)) dfs(b);
  L.order = out;
}
function flowScript(L) {
  const num = new Map(L.order.map((id, i) => [id, i + 1]));
  const links = L.items.map(obj).filter(o => o?.kind === 'link');
  let s = `# ${S.doc.name} — ${L.name}\n\n`;
  for (const id of L.order) {
    const b = obj(id); const n = num.get(id);
    s += `## ${n}. ${b.title || 'Étape ' + n}\n\n`;
    if (b.desc) s += b.desc.trim() + '\n\n';
    const outs = links.filter(l => l.from === id || (l.both && l.to === id)).map(l => { const t = l.from === id ? l.to : l.from; return `${num.get(t)} (${LINK_STYLES[l.style]?.label.toLowerCase()}${l.label ? ' — ' + l.label : ''})`; });
    s += outs.length ? `→ Suite : ${outs.join(', ')}\n\n` : '→ Fin\n\n';
  }
  return s;
}
function exportScript(L) {
  if (!L || !L.type) { const fl = S.doc.layers.filter(l => l.type === 'flow'); L = layerById(flowTabLayer) || fl[0]; }
  if (!L) { toast('Aucun flow'); return; }
  download(`${safeName(S.doc.name)} - ${safeName(L.name)}.md`, new Blob([flowScript(L)], { type: 'text/markdown' }));
}

async function exportImage(o) {
  let W, H, view;
  if (o.zone === 'view') { W = Math.round(S.vw); H = Math.round(S.vh); view = { ...S.view }; }
  else {
    const keep = S.view; S.view = { x: 0, y: 0, z: keep.z };
    let box; try { box = (() => { let bx = null; for (const L of S.doc.layers) { if (!layerDisplay(L).show) continue; for (const id of L.items) { const ob = obj(id); if (!ob || (ob.kind === 'icon' && !iconVisible(ob))) continue; const b = objScreenBox(ob); if (b) bx = bx ? [Math.min(bx[0], b[0]), Math.min(bx[1], b[1]), Math.max(bx[2], b[2]), Math.max(bx[3], b[3])] : b; } } return bx; })(); } finally { S.view = keep; }
    if (!box) { toast('La carte est vide'); return; }
    const pad = 40; W = Math.ceil(box[2] - box[0] + 2 * pad); H = Math.ceil(box[3] - box[1] + 2 * pad);
    if (o.legend) { W = Math.max(W, 320); H = Math.max(H, 240); }
    view = { x: -box[0] + pad, y: -box[1] + pad, z: keep.z };
  }
  const svg = buildExportSVG({ W, H, view, grid: o.grid, legend: o.legend, bg: o.bg });
  const name = safeName(S.doc.name);
  if (o.fmt === 'svg') { download(name + '.svg', new Blob([svg], { type: 'image/svg+xml' })); return; }
  let cw = W * o.scale, ch = H * o.scale; const max = 16000; if (cw > max || ch > max) { const f = Math.min(max / cw, max / ch); cw = Math.floor(cw * f); ch = Math.floor(ch * f); }
  const img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  try { await img.decode(); } catch (e) { toast('Échec du rendu PNG — essaie l’export SVG'); return; }
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  c.getContext('2d').drawImage(img, 0, 0, cw, ch);
  c.toBlob(b => { if (b) download(name + '.png', b); else toast('Image trop grande'); }, 'image/png');
}

async function importImages(files, atScreen, forceImage) {
  let imgs = [...files].filter(f => f.type.startsWith('image/') || /\.svg$/i.test(f.name));
  if (!forceImage && S.mode === 'edit') {
    const svgs = imgs.filter(f => /\.svg$/i.test(f.name) || f.type === 'image/svg+xml');
    if (svgs.length) { imgs = imgs.filter(f => !svgs.includes(f)); askSvgImport(svgs, atScreen); }
  }
  if (!imgs.length) return;
  if (S.mode !== 'edit') { toast('Passe en mode Édition pour importer des images'); return; }
  const L = targetLayerFor('images'), lift = layerLift(L);
  const c = atScreen ? S2W(atScreen[0], atScreen[1], lift) : S2W(S.vw / 2, S.vh / 2, lift);
  const ids = [];
  for (let i = 0; i < imgs.length; i++) {
    const url = await readFileAsDataURL(imgs[i]); const sz = await imgSize(url);
    let w = sz.w, h = sz.h; const maxW = (S.vw * 0.6) / S.view.z; if (w > maxW) { h *= maxW / w; w = maxW; }
    const o = addObject({ kind: 'image', cx: f1(c[0] + i * 24), cy: f1(c[1] + i * 24), w: f1(w), h: f1(h), rot: 0, asset: addAsset(url), style: { opacity: 1 } }, L.id);
    ids.push(o.id);
  }
  S.sel = new Set(ids); commit(); toast(`${ids.length} image(s) importée(s) dans « ${L.name} »`);
}

/* ===== Édition : copier, coller, supprimer, ordre ===== */
function layerTypeForKind(k) { return k === 'image' ? 'images' : k === 'bubble' || k === 'link' ? 'flow' : k === 'icon' ? 'icons' : k === 'note' ? 'notes' : 'draw'; }
function selectionClip() {
  const ids = [...S.sel].filter(id => obj(id) && canEdit(obj(id))); if (!ids.length) return null;
  const set = new Set(ids);
  const items = ids.map(id => deep(obj(id))).filter(o => o.kind !== 'link' || (set.has(o.from) && set.has(o.to)));
  for (const o of Object.values(S.doc.objects)) if (o.kind === 'link' && set.has(o.from) && set.has(o.to) && !set.has(o.id)) items.push(deep(o));
  return { items };
}
function pasteItems(clip, dx, dy) {
  const map = new Map(), newSel = new Set();
  const items = deep(clip.items);
  for (const o of items.filter(o => o.kind !== 'link')) {
    let L = layerById(o.layer); if (!L || !layerDisplay(L).interactive || L.locked || L.type !== layerTypeForKind(o.kind)) L = targetLayerFor(layerTypeForKind(o.kind));
    const nid = uid(); map.set(o.id, nid); const c = { ...o, id: nid }; translateObj(c, o, dx, dy); addObject(c, L.id); newSel.add(nid);
  }
  for (const l of items.filter(o => o.kind === 'link')) { const f = map.get(l.from), t = map.get(l.to); if (!f || !t) continue; addObject({ ...l, id: uid(), from: f, to: t, wps: (l.wps || []).map(p => [p[0] + dx, p[1] + dy]) }, obj(f).layer); }
  S.sel = newSel; commit();
  return newSel;
}
function copySel() { const c = selectionClip(); if (c) { S.clipboard = c; toast(`${c.items.length} objet(s) copié(s)`); } }
function cutSel() { copySel(); deleteSel(); }
function pasteClip() { if (!S.clipboard || S.mode !== 'edit') return; const g = S.doc.grid.size; pasteItems(S.clipboard, g, g); S.clipboard = selectionClip() || S.clipboard; }
function duplicateSel() { const c = selectionClip(); if (!c) return; const g = S.doc.grid.size; pasteItems(c, g, g); }
function deleteSel() {
  const ids = [...S.sel].filter(id => obj(id) && canEdit(obj(id))); if (!ids.length) return;
  for (const id of ids) removeObject(id); S.sel.clear(); S.vertexEdit = null; commit();
}
function zorder(dir) {
  for (const o of selObjs()) {
    const L = layerById(o.layer); const a = L.items, i = a.indexOf(o.id); if (i < 0) continue; a.splice(i, 1);
    const j = dir === 'front' ? a.length : dir === 'back' ? 0 : dir === 'up' ? Math.min(a.length, i + 1) : Math.max(0, i - 1);
    a.splice(j, 0, o.id); stale.add(L.id);
  }
  commit({ keepPanel: true });
}
function nudge(dx, dy) {
  const objs = selObjs().filter(o => canEdit(o) && o.kind !== 'link'); if (!objs.length) return;
  for (const o of objs) { translateObj(o, deep(o), dx, dy); markObj(o); }
  clearTimeout(nudge.t); nudge.t = setTimeout(() => commit({ keepPanel: true }), 350); scheduleRender();
}
function selectAll() {
  const L = layerById(S.activeLayer);
  let ids = L && layerDisplay(L).interactive && !L.locked ? L.items.filter(id => canEdit(obj(id))) : [];
  if (!ids.length) for (const l of S.doc.layers) if (layerDisplay(l).interactive && !l.locked) ids.push(...l.items.filter(id => canEdit(obj(id))));
  S.sel = new Set(ids); afterSelect();
}

/* ===== Info-bulles ===== */
let tipT = null, tipFor = null, tipPinned = null;
function tipHTML(o) {
  if (o.kind === 'bubble') {
    const L = layerById(o.layer), n = L.order.indexOf(o.id) + 1;
    return `<div class="th"><span class="tn" style="background:${o.color || L.color}">${n}</span>${esc(o.title || 'Étape ' + n)}</div>${o.desc ? `<div class="td">${esc(o.desc)}</div>` : ''}`;
  }
  const t = typeById(o.type);
  return `<div class="th">${pictoSVG(t, 20)}<span>${esc(o.name || t?.name || 'Icône')}</span></div>${o.name && t ? `<div class="tt">${esc(t.name)} · ${esc(catById(t.cat)?.name || '')}</div>` : `<div class="tt">${esc(catById(t?.cat)?.name || '')}</div>`}${o.img ? `<img src="${assetHref(o.img)}">` : ''}${o.desc ? `<div class="td">${esc(o.desc)}</div>` : ''}`;
}
function placeTip(o) {
  const t = $('#tip'), b = objScreenBox(o); if (!b) return;
  let x = b[2] + 8, y = b[1] - 4;
  if (x + t.offsetWidth > S.vw - 8) x = b[0] - t.offsetWidth - 8;
  y = clamp(y, 8, S.vh - t.offsetHeight - 8);
  t.style.left = x + 'px'; t.style.top = y + 'px';
}
function showTip(o, pinned) {
  const t = $('#tip'); t.innerHTML = tipHTML(o) + (pinned ? '<button class="tx" title="Fermer">✕</button>' : '');
  t.className = pinned ? 'pinned' : ''; t.style.display = 'block'; placeTip(o);
  $('.tx', t)?.addEventListener('click', () => hideTip(true));
}
function hoverTip(e) {
  if (tipPinned || S.drag) return;
  const oe = e.target.closest?.('[data-oid]'); const o = oe ? obj(oe.dataset.oid) : null;
  if (!hasInfo(o)) { if (tipFor) hideTip(); return; }
  if (tipFor === o.id) return;
  hideTip(); tipFor = o.id; tipT = setTimeout(() => showTip(o, false), 260);
}
function pinTip(o) { clearTimeout(tipT); tipPinned = o.id; tipFor = o.id; showTip(o, true); }
function hideTip(force) { clearTimeout(tipT); if (tipPinned && !force) return; tipFor = null; tipPinned = null; const t = $('#tip'); if (t) t.style.display = 'none'; }

/* ===== Barre d'état ===== */
function updateZoomLabel() { const z = $('#zLabel'); if (z) z.textContent = Math.round(S.view.z * 100) + ' %'; }
function updateCoords(sp) {
  const w = S2W(sp[0], sp[1], activeLift()), u = ppu();
  $('#stCoords').textContent = `x ${rd(w[0] / u)} · y ${rd(w[1] / u)} ${S.doc.grid.unitName}`;
}
function updateStatus() {
  if (!S.doc) return;
  const f = floorById(S.doc.settings.activeFloor), L = layerById(S.activeLayer);
  $('#stInfo').innerHTML = `Étage <b>${esc(f?.name || '')}</b> · Calque <b>${esc(L?.name || '—')}</b>${S.sel.size ? ` · ${S.sel.size} sélectionné(s)` : ''}${S.vertexEdit ? ' · <b>édition des points</b>' : ''}`;
  updateZoomLabel();
  if (tipPinned && obj(tipPinned)) placeTip(obj(tipPinned)); else if (tipPinned) hideTip(true);
}

/* ===== Aide ===== */
function helpModal() {
  const T = (a, b) => `<tr><td>${a}</td><td>${b}</td></tr>`;
  openModal('Aide — Atelier Cartographe', `<div class="help">
  <p>Un outil pour dessiner des cartes de level design : dessin vectoriel, calques, étages, flow map numérotée et icônes à la manière de Map Genie. Tout est enregistré localement dans le navigateur ; utilise <b>Fichier › Enregistrer</b> pour obtenir un fichier .json à partager.</p>
  <h3>Outils</h3><table>${TOOLS.map(t => T(`<kbd>${t.key.toUpperCase()}</kbd> ${t.label}`, HINTS[t.id] || '')).join('')}</table>
  <h3>Navigation et édition</h3><table>
  ${T('Molette', 'Zoom (Maj+molette : défilement horizontal)')}${T('<kbd>Espace</kbd> + glisser, clic milieu', 'Déplacer la vue')}${T('<kbd>0</kbd> / <kbd>1</kbd> / <kbd>+</kbd> <kbd>-</kbd>', 'Tout afficher / zoom 100 % / zoom')}
  ${T('<kbd>Ctrl</kbd>+<kbd>Z</kbd> / <kbd>Ctrl</kbd>+<kbd>Maj</kbd>+<kbd>Z</kbd>', 'Annuler / rétablir')}${T('<kbd>Ctrl</kbd>+<kbd>C</kbd> <kbd>X</kbd> <kbd>V</kbd> <kbd>D</kbd> <kbd>A</kbd>', 'Copier, couper, coller, dupliquer, tout sélectionner (calque actif)')}
  ${T('<kbd>Suppr</kbd>', 'Supprimer la sélection')}${T('Flèches (+<kbd>Maj</kbd>)', 'Déplacer de 1 px (d’une case)')}${T('<kbd>[</kbd> <kbd>]</kbd> (+<kbd>Maj</kbd>)', 'Reculer / avancer (arrière / premier plan)')}
  ${T('<kbd>Alt</kbd> pendant un tracé', 'Désactiver le magnétisme')}${T('<kbd>Maj</kbd>', 'Contraindre : carré, cercle, angles à 45°, proportions')}${T('<kbd>Échap</kbd>', 'Annuler le tracé en cours, finir une chaîne de flow, désélectionner')}
  ${T('<kbd>Ctrl</kbd>+<kbd>S</kbd> / <kbd>Ctrl</kbd>+<kbd>O</kbd>', 'Enregistrer / ouvrir une carte (.json)')}</table>
  <h3>Calques et étages</h3><p>Chaque calque a un type (Dessin, Images, Flow, Icônes, Notes) : les outils choisissent automatiquement un calque compatible sur l’étage actif, ou en créent un. Glisse les calques pour les réordonner ; ⚙ permet de changer d’étage, de couleur de flow ou de rendre un calque commun à tous les étages.</p>
  <p>Les <b>étages</b> ont une altitude. « Oignon » affiche l’étage inférieur en transparence ; la vue <b>Isométrique</b> empile les étages ; la vue <b>Hauteurs</b> colore les formes selon leur altitude (étage + hauteur de la forme).</p>
  <h3>Flow map</h3><p>Avec l’outil Flow, chaque clic pose une bulle reliée à la précédente. Clique sur une bulle existante pour la relier (deux clics dans les deux sens créent un lien à double sens). Maj+clic repart d’une bulle pour créer une branche. Clic sur un lien : insère une bulle entre deux autres et décale la numérotation. Le panneau Flow liste les étapes, permet de les réordonner, de les décrire et d’exporter le script.</p>
  <h3>Collaboration en ligne</h3><p>Menu <b>☁ En ligne</b> : se connecter (e-mail + mot de passe), <b>publier</b> la carte, puis <b>Partager</b> pour inviter des personnes par e-mail ou ouvrir l’accès à tout compte connecté qui a le lien, en lecture, commentaire ou édition. Les modifications, les curseurs et les personnes présentes s’affichent en direct. Annuler (Ctrl+Z) n’annule que tes propres actions. Si deux personnes modifient le même objet en même temps, la dernière modification l’emporte.</p>
  <h3>Modes</h3><p><b>Édition</b> : tout modifier. <b>Commentaire</b> : poser et éditer des notes seulement. <b>Lecture</b> : consulter, filtrer les icônes, cliquer sur les bulles et icônes pour lire leur fiche.</p></div>`, { wide: true });
}

/* ===== Clavier ===== */
function onKey(e) {
  const tgt = e.target, inField = tgt.matches?.('input, textarea, select, [contenteditable]');
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod && k === 's') { e.preventDefault(); saveSmart(e.shiftKey); return; }
  if (mod && k === 'o') { e.preventDefault(); openDoc(); return; }
  if (e.key === 'Escape' && $('#modalBg').style.display === 'flex') { closeModal(); return; }
  if (inField) { if (e.key === 'Escape') tgt.blur(); return; }
  if ($('#modalBg').style.display === 'flex') return;
  if (e.key === ' ') { if (!S.spaceDown) { S.spaceDown = true; $('#stage').classList.add('space'); } e.preventDefault(); return; }
  if (e.key === 'Alt') { S.altDown = true; e.preventDefault(); }
  if (e.key === 'Shift') { S.shiftDown = true; scheduleRender(); }
  if (mod) {
    if (k === 'z' && S.mode === 'edit') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (k === 'y' && S.mode === 'edit') { e.preventDefault(); redo(); }
    else if (k === 'c') { e.preventDefault(); copySel(); }
    else if (k === 'x' && S.mode === 'edit') { e.preventDefault(); cutSel(); }
    else if (k === 'v') { /* géré par l'événement paste */ }
    else if (k === 'd' && S.mode === 'edit') { e.preventDefault(); duplicateSel(); }
    else if (k === 'a') { e.preventDefault(); selectAll(); }
    return;
  }
  switch (e.key) {
    case 'Escape':
      if (S.draft) { cancelDraft(); return; }
      if (S.measure) { S.measure = null; scheduleRender(); return; }
      if (S.flowCur) { S.flowCur = null; renderToolOptions(); scheduleRender(); return; }
      if (S.vertexEdit) { S.vertexEdit = null; scheduleRender(); refreshProps(); return; }
      hideTip(true); S.sel.clear(); afterSelect(); return;
    case 'Enter': if (S.draft) { finishDraft(); e.preventDefault(); } return;
    case 'Delete': case 'Backspace':
      e.preventDefault();
      if (S.draft) { const o = obj(S.draft.id); if (o?.pts && o.pts.length > 1) { o.pts.pop(); markObj(o); scheduleRender(); } else if (o?.nodes && o.nodes.length > 1) { o.nodes.pop(); markObj(o); scheduleRender(); } else cancelDraft(); return; }
      deleteSel(); return;
    case 'ArrowLeft': case 'ArrowRight': case 'ArrowUp': case 'ArrowDown': {
      e.preventDefault(); if (S.mode !== 'edit' && !selObjs().some(o => o.kind === 'note')) return;
      const st = e.shiftKey ? S.doc.grid.size : 1; const d = { ArrowLeft: [-st, 0], ArrowRight: [st, 0], ArrowUp: [0, -st], ArrowDown: [0, st] }[e.key]; nudge(d[0], d[1]); return;
    }
    case '[': case '{': if (S.mode === 'edit') zorder(e.shiftKey || e.key === '{' ? 'back' : 'down'); return;
    case ']': case '}': if (S.mode === 'edit') zorder(e.shiftKey || e.key === '}' ? 'front' : 'up'); return;
    case '+': case '=': zoomAt([S.vw / 2, S.vh / 2], S.view.z * 1.25); return;
    case '-': case '_': zoomAt([S.vw / 2, S.vh / 2], S.view.z / 1.25); return;
    case '0': fitView(); return;
    case '1': zoomAt([S.vw / 2, S.vh / 2], 1); return;
  }
  const t = TOOLS.find(t => t.key === k);
  if (t && !e.altKey) setTool(t.id);
}

/* ===== Initialisation ===== */
async function init() {
  $('#staticDefs').innerHTML = staticDefs();
  try { S.user = localStorage.getItem('ac_user') || ''; } catch (e) { }
  renderToolbar();
  const st = $('#stage');
  st.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  st.addEventListener('dblclick', onDbl);
  st.addEventListener('wheel', onWheel, { passive: false });
  st.addEventListener('contextmenu', e => e.preventDefault());
  st.addEventListener('pointerleave', () => { if (!S.drag) { S.cursorS = null; hideTip(); scheduleRender(); } });
  window.addEventListener('keydown', onKey);
  window.addEventListener('keyup', e => { if (e.key === ' ') { S.spaceDown = false; $('#stage').classList.remove('space'); } if (e.key === 'Alt') S.altDown = false; if (e.key === 'Shift') { S.shiftDown = false; scheduleRender(); } });
  window.addEventListener('blur', () => { S.spaceDown = false; S.altDown = false; S.shiftDown = false; $('#stage').classList.remove('space'); });
  new ResizeObserver(() => { const r = $('#canvasWrap').getBoundingClientRect(); S.vw = r.width; S.vh = r.height; scheduleRender(); }).observe($('#canvasWrap'));
  { const r = $('#canvasWrap').getBoundingClientRect(); S.vw = r.width || 800; S.vh = r.height || 600; }
  // Barre du haut
  $('#bFile').onclick = e => fileMenu(e.currentTarget);
  $('#bUndo').onclick = undo; $('#bRedo').onclick = redo;
  $$('#viewSeg button').forEach(b => b.onclick = () => setViewMode(b.dataset.v));
  $$('.isorot').forEach(b => b.onclick = () => rotateIso(+b.dataset.r));
  $$('#modeSeg button').forEach(b => b.onclick = () => applyMode(b.dataset.m));
  $('#bGrid').onclick = e => gridPopover(e.currentTarget);
  $('#bHeight').onclick = e => heightPopover(e.currentTarget);
  $('#bLegend').onclick = legendModal;
  $('#bHelp').onclick = helpModal;
  $('#bCloud').onclick = e => cloudMenu(e.currentTarget);
  $('#docName').onchange = e => { S.doc.name = e.target.value.trim() || 'Carte'; commit({ keepPanel: true }); };
  $$('#sideTabs button').forEach(b => b.onclick = () => showSideTab(b.dataset.tab));
  $('#zIn').onclick = () => zoomAt([S.vw / 2, S.vh / 2], S.view.z * 1.25);
  $('#zOut').onclick = () => zoomAt([S.vw / 2, S.vh / 2], S.view.z / 1.25);
  $('#zLabel').onclick = () => zoomAt([S.vw / 2, S.vh / 2], 1);
  $('#zFit').onclick = () => fitView();
  $('#modalBg').addEventListener('pointerdown', e => { if (e.target.id === 'modalBg') closeModal(); });
  // Fichiers
  $('#fileImg').onchange = e => { importImages(e.target.files); e.target.value = ''; };
  $('#fileJson').onchange = async e => { const f = e.target.files[0]; if (f) loadFromText(await readFileAsText(f)); e.target.value = ''; };
  $('#fileLib').onchange = async e => { const f = e.target.files[0]; if (f) importLibrary(await readFileAsText(f)); e.target.value = ''; };
  const wrap = $('#canvasWrap');
  wrap.addEventListener('dragover', e => { if (e.dataTransfer.types.includes('Files')) e.preventDefault(); });
  wrap.addEventListener('drop', async e => {
    if (!e.dataTransfer.files.length) return; e.preventDefault();
    const files = [...e.dataTransfer.files]; const json = files.find(f => /\.json$/i.test(f.name));
    if (json) { const txt = await readFileAsText(json); confirmBox(`Ouvrir « ${esc(json.name)} » ? (une bibliothèque d’icônes sera fusionnée)`, () => loadFromText(txt), 'Ouvrir'); return; }
    importImages(files, svgPt(e));
  });
  window.addEventListener('paste', e => {
    if (e.target.matches?.('input, textarea')) return;
    const files = [...(e.clipboardData?.files || [])];
    if (files.length) { e.preventDefault(); importImages(files); return; }
    pasteClip();
  });
  window.addEventListener('beforeunload', e => { if (IDB.db && S.doc && !C.mapId) IDB.set('autosave', JSON.stringify(S.doc)); if (C.mapId && (C.pending.objs.size || C.pending.meta || C.flushing)) { cloudFlush(); e.preventDefault(); e.returnValue = ''; } });
  // Données
  await IDB.open();
  let d = null;
  if (IDB.db) { const a = await IDB.get('autosave'); if (a) try { d = migrate(JSON.parse(a)); } catch (e) { d = null; } }
  if (d) { loadDoc(d); toast('Session précédente restaurée'); }
  else {
    let lib = null; if (IDB.db) { const l = await IDB.get('library'); if (l) try { lib = JSON.parse(l); } catch (e) { } }
    const nd = newDoc(lib ? { cats: lib.cats, types: lib.types } : null); if (lib?.assets) Object.assign(nd.assets, lib.assets);
    loadDoc(nd); S.view = { x: S.vw / 2, y: S.vh / 2, z: 1 };
  }
  setTool('select'); showSideTab('props');
  cloudBoot();
}
init();

</script>
